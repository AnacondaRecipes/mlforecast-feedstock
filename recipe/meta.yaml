{% set name = "mlforecast" %}
{% set version = "1.1.0" %}


package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 5f0baf178a4017785475db86d56d628a48cf267d5b8ea6ebef798d9ddf396bd8

build:
  number: 1
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  skip: true  # [py<310]

requirements:
  host:
    - python
    - pip
    - wheel
    - setuptools >=61.0
  run:
    - python
    - cloudpickle
    - coreforecast>=0.0.15
    - fsspec
    - narwhals
    - optuna
    - pandas <3.0
    - scikit-learn
    - utilsforecast>=0.2.9
  run_constrained:
    # dask
    - fugue >=0.9.4
    ## ray
    # Omit ray-extra xgboost pin: it is not a base/runtime requirement, and as
    # global run_constrained it blocks newer xgboost (3.x) in shared envs.
    # - xgboost_ray >=0.1.19  # [not win and py<314]
    # - xgboost >=2.0.0,<2.1.0  # [not win and py<314]
    # spark
    - pyspark >=3.3

test:
  imports:
    - mlforecast 
  requires:
    - pip
  commands:
    - pip check

about:
  home: https://github.com/Nixtla/mlforecast
  dev_url: https://github.com/Nixtla/mlforecast
  doc_url: https://nixtla.github.io/mlforecast/
  license: Apache-2.0
  license_file: LICENSE
  license_family: APACHE
  summary: Scalable machine learning based time series forecasting
  description: |
    mlforecast is a framework to perform time series forecasting using machine learning models, 
    with the option to scale to massive amounts of data using remote clusters.

extra:
  recipe-maintainers:
    - jmoralez
